[project]
name = "beemo"
version = "0.1.0"
description = "Small local fine-tuned model that writes commit messages from staged diffs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "trl>=0.11",
    "datasets>=3.0",
    "sentencepiece",
    "evaluate",
    "sacrebleu",
    "rouge-score",
]

[project.scripts]
beemo = "commit_model.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
